<script>
  (function() {
    let currentAmount = "250";
    let selectedCategory = "Food";

    const displayEl = document.getElementById("amount-display");
    const saveBtnText = document.getElementById("save-btn-text");
    const microcopyEl = document.getElementById("microcopy");
    const categoryHintEl = document.getElementById("category-hint");
    const categoryButtons = document.querySelectorAll(".category-chip");
    const keypadButtons = document.querySelectorAll(".keypad-btn");
    const saveBtn = document.getElementById("save-btn");
    const toast = document.getElementById("save-toast");
    const voiceBtn = document.getElementById("voice-btn");

    function updateDisplay() {
      displayEl.textContent = currentAmount || "0";
      const displayVal = currentAmount || "0";
      saveBtnText.textContent = `Save Expense (₹${displayVal})`;
      microcopyEl.textContent = `Expense saves to ${selectedCategory} automatically`;
    }

    // Keypad interactions
    keypadButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const key = btn.getAttribute("data-key");
        
        // Tactile vibration if supported
        if (navigator.vibrate) navigator.vibrate(10);

        if (key === "backspace") {
          if (currentAmount.length > 0) {
            currentAmount = currentAmount.slice(0, -1);
          }
        } else if (key === ".") {
          if (!currentAmount.includes(".")) {
            currentAmount = (currentAmount || "0") + ".";
          }
        } else {
          // Prevent overflowing numbers
          if (currentAmount.length >= 8) return;
          
          if (currentAmount === "0") {
            currentAmount = key;
          } else {
            currentAmount += key;
          }
        }
        updateDisplay();
      });
    });

    // Category Selector
    categoryButtons.forEach((chip) => {
      chip.addEventListener("click", () => {
        categoryButtons.forEach((c) => {
          c.setAttribute("aria-checked", "false");
          c.classList.remove("bg-secondary-container", "text-on-secondary-container");
          c.classList.add("bg-surface-container-lowest", "text-on-surface");
        });

        chip.setAttribute("aria-checked", "true");
        chip.classList.remove("bg-surface-container-lowest", "text-on-surface");
        chip.classList.add("bg-secondary-container", "text-on-secondary-container");

        selectedCategory = chip.getAttribute("data-category");
        categoryHintEl.textContent = `${selectedCategory} selected`;
        updateDisplay();

        if (navigator.vibrate) navigator.vibrate(12);
      });
    });

    // Save Flow with instant tactile feedback
    saveBtn.addEventListener("click", () => {
      if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
      saveBtn.disabled = true;
      saveBtn.classList.add("opacity-90");
      saveBtnText.textContent = "Saving...";

      setTimeout(() => {
        saveBtn.classList.add("hidden");
        toast.classList.remove("hidden");
        
        setTimeout(() => {
          if (window.history.length > 1) {
            window.history.back();
          }
        }, 1200);
      }, 350);
    });

    // Voice simulation
    voiceBtn.addEventListener("click", () => {
      const voicePill = voiceBtn.querySelector("span:last-child");
      voicePill.textContent = "Listening...";
      voiceBtn.classList.add("bg-primary-container", "text-on-primary");
      
      setTimeout(() => {
        currentAmount = "480";
        selectedCategory = "Travel";
        categoryButtons.forEach((c) => {
          if (c.getAttribute("data-category") === "Travel") {
            c.click();
          }
        });
        voicePill.textContent = "Auto-filled!";
        setTimeout(() => {
          voicePill.textContent = "Voice";
          voiceBtn.classList.remove("bg-primary-container", "text-on-primary");
        }, 1500);
        updateDisplay();
      }, 1000);
    });
  })();
</script></main></body></html>
